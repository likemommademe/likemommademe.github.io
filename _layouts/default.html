<!doctype html>
<html lang="{{ site.lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% assign info = site.data.impostazioni %}
  <title>{% if page.title %}{{ page.title }} — {% endif %}{{ info.nome }}</title>
  <meta name="description" content="{{ site.data.home.intro }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <header class="site-header">
    <a class="logo" href="{{ '/' | relative_url }}">{{ info.nome }}</a>
    <nav>
      <a href="{{ '/work/' | relative_url }}">Work</a>
      <a href="{{ '/about/' | relative_url }}">About</a>
    </nav>
  </header>

  <main>
    {{ content }}
  </main>

  <footer class="site-footer">
    <span>© {{ 'now' | date: '%Y' }} {{ info.nome }}</span>
    {% include contatti.html %}
  </footer>
</body>
</html>
