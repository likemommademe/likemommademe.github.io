# Testi provvisori della pagina About: li riscriviamo insieme
about:
  sottotitolo: Creative designer. Identità visive, brand communication e contenuti per digital, stampa ed eventi, dal concept alla consegna.
  foto_titolo: Dietro le quinte
  anni_titolo: "Come mamma mi ha fatto, anno per <em>anno</em>"
  anni_lead: Progetto, produco e coordino. Senza perdere di vista i dettagli.
  tappe:
    - anno: 2015
      testo: Diploma in Grafica al Liceo Artistico Pinturicchio. Da qui non ho più smesso di disegnare.
    - anno: 2019
      testo: Primi lavori da designer grafico, alla Gps Srl Group. Scopro che i file vanno anche consegnati.
    - anno: 2020
      testo: "Laurea in Grafica editoriale all'Accademia di Belle Arti di Roma. E la mia tesi diventa l'identità dell'<a class=\"anni__link\" href=\"/progetti/accademia-dei-romani/\">Accademia dei Romani</a>."
    - anno: 2021
      testo: "Master in Digital Art Direction allo IED di Roma. La tesi è <a class=\"anni__link\" href=\"/progetti/situation/\">SITUATION</a>, un'app per allenatori di pallavolo."
    - anno: 2022
      testo: Graphic e UX designer da Pixell. Brand identity, wireframe e design di siti, social, stampa e stand per le fiere, dal concept ai file per la produzione.
    - anno: 2023
      testo: Entro in Ficacci Olive Company come Digital Marketing Specialist. Layout, campagne e video, ogni giorno.
    - anno: 2025
      testo: Divento Marketing & Creative designer in Ficacci. Identità, campagne, packaging e materiali per web e stampa.
    - anno: 2026
      testo: Masterclass AI x Fashion Futures alla Futura AI Academy. L'intelligenza artificiale entra nel mio modo di lavorare.
    - anno: 2027
      testo: Nasce LIKEMOMMADEME, con un sito fatto su misura.
    - anno: "∞"
      testo: Non smetterò di stupirmi.
  valori_titolo: "Tre parole mi <em>descrivono</em>"
  valori:
    - nome: Visione
      testo: Concept e art direction. Ogni progetto nasce da un'idea forte e riconoscibile.
    - nome: Execution
      testo: Identità visive e contenuti per digital, stampa ed eventi, curati fino all'ultimo dettaglio.
    - nome: Coordinamento
      testo: Clienti, team interni, fornitori e partner. Tanti livelli, un solo risultato.
  strumenti_titolo: "Con cosa <em>lavoro</em>"
  strumenti:
    - gruppo: Adobe Creative Suite
      voci: [Photoshop, Illustrator, InDesign, Premiere Pro, After Effects, Firefly]
    - gruppo: Creative AI
      voci: [ChatGPT, Claude, Midjourney, Firefly]
      nota: Strumenti AI applicati a design, content creation e workflow creativi.
    - gruppo: UI/UX e prototipazione
      voci: [Figma, Sketch, Adobe XD, Framer]
  clienti_titolo: Clienti
  dove_titolo: "Da dove <em>lavoro</em>"
  dove_testo: Vivo e lavoro a Roma. Per i progetti giusti anche da remoto, ovunque.
  dove:
    - citta: Roma
      dettaglio: In sede
      fuso: Europe/Rome
      sigla: ITA
    - citta: Ovunque
      dettaglio: Da remoto
      fuso: ""
      sigla: WEB
  faq_titolo: "Domande<em class=\"p\">?</em>"
  faq:
    - d: Chi c'è dietro LIKEMOMMADEME?
      r: Io, Emanuele Calfa, creative designer di Roma. Seguo ogni progetto dal concept alla consegna, e quando serve coinvolgo fotografi, sviluppatori e stampatori di fiducia.
    - d: Che lavori fai?
      r: Cinque mondi. Branding, illustrazione, motion design, generative AI e web design. Spesso insieme, nello stesso progetto.
    - d: Lavori anche con le agenzie?
      r: Sì, ci sono cresciuto. In Pixell ho lavorato dentro un team di grafici e sviluppatori; posso entrare in un team esistente oppure prendere in mano un progetto intero.
    - d: Usi l'intelligenza artificiale?
      r: Sì, come uno strumento tra gli altri. L'idea e la direzione restano mie; l'AI mi aiuta a esplorare di più e più in fretta.
    - d: Quanto costa un progetto?
      r: Dipende da cosa serve davvero. Scrivimi due righe sul progetto e ti mando una proposta chiara, con tempi e costi.
    - d: In quanto tempo rispondi?
      r: "Di solito in giornata. Se non rispondo, sto disegnando: riprova il giorno dopo."

