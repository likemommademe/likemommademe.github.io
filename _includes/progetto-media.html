{% comment %} Un elemento della galleria di un progetto: foto o video, con la didascalia se c'è. {% endcomment %}
{% assign el = include.el %}
<figure class="cs-media{% if el.type == 'video' %} cs-media--video{% endif %}{% if el.formato == 'sola' %} cs-media--sola{% endif %}{% if el.formato == 'grande' %} cs-media--grande{% endif %}"{% if el.formato == 'sola' or el.formato == 'grande' %} data-abbinata="no"{% endif %}{% if el.type != "video" and el.titolo %} tabindex="0"{% endif %} data-rivela>
  {% if el.type == "video" %}
    {% include video.html url=el.link %}
  {% else %}
    <img src="{{ el.immagine | relative_url }}" alt="{% if el.titolo %}{{ el.titolo }}: {% endif %}{{ el.didascalia | default: include.titolo }}" loading="lazy">
  {% endif %}
  {% if el.titolo or el.didascalia %}<figcaption class="cs-cap">{% if el.titolo %}<strong class="cs-cap__t">{{ el.titolo }}</strong>{% endif %}{% if el.didascalia %}<span class="cs-cap__p">{{ el.didascalia }}</span>{% endif %}</figcaption>{% endif %}
</figure>
