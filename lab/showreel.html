<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LIKEMOMMADEME Showreel</title>
<meta name="robots" content="noindex">
<meta name="description" content="Showreel di LIKEMOMMADEME, Creative Designer: cinque mondi in quindici secondi.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%233D5AFF'/%3E%3Cpath d='M10 7h4v14h8v4H10z' fill='%23F5F5F2'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://api.fontshare.com">
<link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=cabinet-grotesk@500,900&display=swap">
<style>
  :root {
    --ink: #0A0A0A; --paper: #F5F5F2; --muted: #8A8A8A; --line: #262626;
    --blue: #3D5AFF; --green: #12C08E; --pink: #FF3D8B;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }

  #stage {
    position: absolute; left: 0; top: 0; width: 1920px; height: 1080px;
    transform-origin: 0 0; overflow: hidden;
    background: var(--ink); color: var(--paper);
    font-family: "Cabinet Grotesk", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .abs { position: absolute; }
  .mask { display: inline-block; overflow: hidden; vertical-align: top; }
  .mask > span { display: inline-block; }
  #cam { left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; }

  /* Nome */
  #name { position: absolute; left: 0; right: 0; top: 372px; text-align: center; white-space: nowrap;
          font-weight: 900; font-size: 190px; line-height: .8; letter-spacing: -.02em; z-index: 5; }
  #name .mask { padding: .1em 0 .04em; margin: -.1em 0 -.04em; }
  #role { position: absolute; left: 0; right: 0; top: 560px; text-align: center;
          font-weight: 500; font-size: 44px; line-height: 1.15; }
  .sq { width: 64px; height: 64px; border-radius: 12px; }

  /* Cornice: marchio e mondi */
  #mark { left: 64px; top: 52px; font-weight: 900; font-size: 30px; line-height: 1; letter-spacing: -.01em; z-index: 9; }
  .w { position: absolute; top: 980px; width: 288px; margin-left: -144px; text-align: center;
       font-weight: 500; font-size: 26px; line-height: 1.3; z-index: 9; }
  .w .mask { padding-bottom: 2px; }
  .w i { position: absolute; left: 50%; bottom: -12px; width: 64px; height: 4px; margin-left: -32px;
         border-radius: 2px; transform: scaleX(0); }

  /* Titoli dei mondi: a sinistra, in uno spazio loro, mentre la camera sposta il mondo a destra */
  #big { left: 64px; top: 0; width: 780px; height: 1080px; z-index: 8; pointer-events: none; }
  #big .word { position: absolute; left: 0; white-space: nowrap; font-weight: 900; line-height: .8; letter-spacing: -.03em; }
  #big .word .mask { padding-top: .08em; margin-top: -.08em; }
  #big .cap { position: absolute; left: 4px; font-weight: 500; font-size: 30px; line-height: 1.2; color: var(--paper); white-space: nowrap; }

  svg#fx { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: visible; pointer-events: none; z-index: 4; }

  /* Generative AI */
  #ai { left: 410px; top: 190px; width: 1100px; height: 640px; border-radius: 24px; background: #141414;
        box-shadow: inset 0 0 0 2px var(--line); }
  #ai .dots { position: absolute; left: 28px; top: 30px; display: flex; gap: 10px; }
  #ai .dots i { width: 14px; height: 14px; border-radius: 50%; background: #2E2E2E; }
  #ai .ttl { position: absolute; left: 104px; top: 24px; font-weight: 500; font-size: 20px; color: var(--muted); }
  #field { left: 40px; top: 80px; width: 1020px; height: 84px; border-radius: 42px; background: var(--ink); box-shadow: inset 0 0 0 2px var(--line); overflow: hidden; }
  #ftext { left: 90px; top: 24px; font-weight: 500; font-size: 30px; line-height: 36px; white-space: nowrap; }
  #ftext .caret { display: inline-block; width: 3px; height: 32px; margin-left: 4px; vertical-align: -5px; background: var(--pink); }
  #fbar { left: 0; bottom: 0; width: 1020px; height: 4px; background: var(--pink); transform-origin: 0 50%; transform: scaleX(0); }
  #gen { left: 880px; top: 94px; width: 160px; height: 56px; border-radius: 28px; background: var(--pink); color: var(--ink);
         font-weight: 900; font-size: 24px; display: flex; align-items: center; justify-content: center; }
  .res { top: 200px; width: 237px; height: 400px; border-radius: 16px; overflow: hidden; }
  #cursor { left: 0; top: 0; width: 40px; height: 40px; z-index: 6; transform-origin: 6px 4px; overflow: visible; }

  /* Motion Design */
  #kin { left: 0; right: 0; top: 330px; text-align: center; white-space: nowrap;
         font-weight: 900; font-size: 250px; line-height: .8; letter-spacing: -.02em; }
  #kin span { display: inline-block; }

  /* UI/UX */
  #phone { overflow: hidden; z-index: 3; }
  #pfill { position: absolute; inset: 0; background: var(--paper); transform-origin: 50% 100%; }
  #pcontent { position: absolute; left: 0; top: 0; width: 420px; height: 800px; color: var(--ink); transform-origin: 210px 400px; }
  #ptitle { left: 36px; top: 46px; font-weight: 900; font-size: 40px; line-height: 1.05; }
  #track { left: 300px; top: 44px; width: 84px; height: 44px; border-radius: 22px; }
  #chart { left: 36px; top: 150px; width: 348px; height: 220px; }
  #chart b { position: absolute; bottom: 0; width: 50px; border-radius: 8px 8px 0 0; transform-origin: 50% 100%; }
  #slab { left: 36px; top: 410px; font-weight: 500; font-size: 22px; }
  #sval { right: 36px; top: 410px; font-weight: 900; font-size: 22px; }
  #strack { left: 36px; top: 470px; width: 348px; height: 6px; border-radius: 3px; background: #CFCFCA; }
  #sfill { left: 0; top: 0; width: 348px; height: 6px; border-radius: 3px; background: var(--blue); transform-origin: 0 50%; }
  #sknob { left: -15px; top: -12px; width: 30px; height: 30px; border-radius: 50%; background: var(--ink); }
  #btnm { left: 36px; top: 640px; width: 348px; height: 84px; border-radius: 42px; overflow: hidden; }
  #btn { position: absolute; inset: 0; border-radius: 42px; background: var(--blue); color: var(--paper);
         font-weight: 500; font-size: 28px; display: flex; align-items: center; justify-content: center; }

  /* Comandi */
  #ui { position: fixed; left: 0; right: 0; bottom: 0; height: 56px; display: flex; align-items: center; justify-content: center;
        gap: 14px; font: 14px/1 system-ui, sans-serif; color: #bbb; }
  #ui button { font: inherit; color: #eee; background: #1b1b1b; border: 1px solid #333; border-radius: 8px; padding: 8px 14px; cursor: pointer; }
  #ui button:focus-visible, #ui input:focus-visible { outline: 2px solid #3D5AFF; outline-offset: 2px; }
  #ui input { width: min(46vw, 620px); accent-color: #3D5AFF; }
  #tc { width: 92px; font-variant-numeric: tabular-nums; }
  body.clean #ui { display: none; }

  /* Modalità scroll ed embed */
  html.scroll, html.scroll body { overflow-x: hidden; overflow-y: visible; height: auto; }
  body.scroll #stage { position: fixed; }
  body.scroll #ui, body.embed #ui { display: none; }
  #scroller { display: none; }
  body.scroll #scroller { display: block; height: 1600vh; }
  #hint { position: fixed; left: 0; right: 0; bottom: 28px; text-align: center; display: none;
          font: 500 15px/1 "Cabinet Grotesk", system-ui, sans-serif; color: #8A8A8A; transition: opacity .25s; }
  body.scroll #hint, body.embed #hint { display: block; }
  body.embed { background: var(--ink); }
</style>
</head>
<body>
<div id="stage" role="img" aria-label="Showreel di LIKEMOMMADEME, Creative Designer: Brand Identity, Illustration, Generative AI, Motion Design, UI/UX Design.">

  <div id="cam" class="abs">
    <div id="ai" class="abs">
      <div class="dots"><i></i><i></i><i></i></div>
      <div class="ttl">Generatore</div>
      <div id="field" class="abs"><div id="ftext" class="abs"><span id="ptext"></span><span class="caret"></span></div><div id="fbar" class="abs"></div></div>
      <div id="gen" class="abs">Genera</div>
      <div id="results"></div>
    </div>

    <div id="kin" class="abs"></div>

    <div id="phone" class="abs">
      <div id="pfill"></div>
      <div id="pcontent">
        <div id="ptitle" class="abs"><span class="mask"><span>Ciao, mamma!</span></span></div>
        <div id="track" class="abs"></div>
        <div id="chart" class="abs"></div>
        <div id="slab" class="abs">Ironia</div>
        <div id="sval" class="abs">15%</div>
        <div id="strack" class="abs"><div id="sfill" class="abs"></div><div id="sknob" class="abs"></div></div>
        <div id="btnm" class="abs"><div id="btn">Avanti</div></div>
      </div>
    </div>

    <svg id="fx" viewBox="0 0 1920 1080" aria-hidden="true">
      <g id="grid" fill="none" stroke="#8A8A8A" stroke-width="2">
        <rect x="-260" y="-260" width="520" height="520" pathLength="1"/>
        <circle r="260" pathLength="1"/>
        <circle r="130" pathLength="1"/>
        <path d="M-360 0H360" pathLength="1"/>
        <path d="M0 -360V360" pathLength="1"/>
        <path d="M-260 -260L260 260" pathLength="1"/>
        <path d="M260 -260L-260 260" pathLength="1"/>
      </g>
      <g id="boxes"></g>
      <g id="sqs"></g>
      <g id="graph" fill="none">
        <path id="tl" d="M510 830H1410" stroke="#3A3A3A" stroke-width="6" stroke-linecap="round" pathLength="1"/>
        <rect class="kf" x="-13" y="-13" width="26" height="26" rx="4"/>
        <rect class="kf" x="-13" y="-13" width="26" height="26" rx="4"/>
        <rect class="kf" x="-13" y="-13" width="26" height="26" rx="4"/>
      </g>
      <path id="blob"/>
      <path id="contour" fill="none" stroke="#F5F5F2" stroke-width="5" stroke-linejoin="round" pathLength="1"/>
      <g id="face">
        <circle id="eyeL" r="16" fill="#0A0A0A"/>
        <circle id="eyeR" r="16" fill="#0A0A0A"/>
        <path id="smile" d="M-84 40Q0 128 84 40" fill="none" stroke="#0A0A0A" stroke-width="14" stroke-linecap="round" pathLength="1"/>
      </g>
      <g id="pen">
        <path d="M9 -27L77 -95L95 -77L27 -9Z" fill="#FF3D8B"/>
        <path d="M77 -95L88 -106L106 -88L95 -77Z" fill="#F5F5F2"/>
        <path d="M0 0L9 -27L27 -9Z" fill="#F5F5F2"/>
        <path d="M0 0L4 -12L12 -4Z" fill="#0A0A0A"/>
      </g>
    </svg>
    <svg id="cursor" class="abs" viewBox="0 0 40 40" aria-hidden="true"><path d="M6 4V32L13.5 25.5L18.5 36L23.5 33.8L18.6 23.4H29Z" fill="#F5F5F2" stroke="#0A0A0A" stroke-width="2.5" stroke-linejoin="round"/></svg>

    <div id="name" aria-hidden="true"></div>
    <div id="role" aria-hidden="true"><span class="mask"><span>Creative Designer</span></span></div>
    <div id="sq1" class="abs sq" style="background:var(--blue)"></div>
    <div id="sq2" class="abs sq" style="background:var(--green)"></div>
    <div id="sq3" class="abs sq" style="background:var(--pink)"></div>
  </div>

  <div id="big" class="abs" aria-hidden="true"></div>
  <div id="mark" class="abs"><span class="mask"><span>LIKEMOMMADEME</span></span></div>
  <div id="worlds" aria-hidden="true"></div>
</div>

<div id="scroller"></div>
<div id="hint">Scorri: cinque mondi ti aspettano</div>
<div id="ui">
  <button id="pp" type="button">Pausa</button>
  <input id="scrub" type="range" min="0" max="15" step="0.01" value="0" aria-label="Posizione nel tempo">
  <span id="tc">00.00 / 15</span>
  <button id="snd" type="button" aria-pressed="false">Suono: no</button>
</div>

<script>
(() => {
  /* ---------- Costanti ---------- */
  const DUR = 15, BEAT = .5, TAU = Math.PI * 2;
  const INK = '#0A0A0A', PAPER = '#F5F5F2', BLUE = '#3D5AFF', GREEN = '#12C08E', PINK = '#FF3D8B', TRACK = '#CFCFCA', LINE = '#262626';
  const G = 80;                                  // apertura del nome: LIKE · MOM · MADE · ME
  const GOFF = [-1.5, -.5, .5, 1.5];             // spostamento di ogni parola, in multipli di G
  // I cinque mondi: inizio e fine nel tempo. Brand ha due battute (il cubo), gli altri una.
  const WORLDS = [
    { label: 'Brand Identity', col: BLUE,  t0: 2,  t1: 6,  big: 'BRANDING',     cap: 'Identità che stanno in piedi da sole.' },
    { label: 'Illustration',   col: GREEN, t0: 6,  t1: 8,  big: 'ILLUSTRATION', cap: 'Disegnate a mano. Sì, davvero.' },
    { label: 'Generative AI',  col: PINK,  t0: 8,  t1: 10, big: 'GEN AI',       cap: 'Il prompt lo scrivo io.', bigEnd: 8.42, maxW: 560 },
    { label: 'Motion Design',  col: PINK,  t0: 10, t1: 12, big: null },
    { label: 'UI/UX Design',   col: BLUE,  t0: 12, t1: 14, big: 'UI/UX',        cap: 'Interfacce che si usano davvero.' }
  ];
  const ROW_X = [384, 672, 960, 1248, 1536];
  const SHIFT = 300;                             // la camera sposta il mondo a destra per lasciare spazio al titolo
  const P = { x: 750, y: 120, w: 420, h: 800 };  // schermo del telefono
  const KY = P.y + 66, KOFF = P.x + 322, KON = P.x + 362;

  /* ---------- Funzioni del tempo ---------- */
  const clamp = (x, a = 0, b = 1) => x < a ? a : x > b ? b : x;
  const p = (t, a, b) => clamp((t - a) / (b - a));
  const lerp = (a, b, k) => a + (b - a) * k;
  const eOut = x => x >= 1 ? 1 : 1 - Math.pow(2, -10 * x);
  const eIn = x => x <= 0 ? 0 : Math.pow(2, 10 * x - 10);
  const eIO = x => x <= 0 ? 0 : x >= 1 ? 1 : x < .5 ? Math.pow(2, 20 * x - 10) / 2 : (2 - Math.pow(2, -20 * x + 10)) / 2;
  const spring = x => x <= 0 ? 0 : x >= 1 ? 1 : 1 - (1 + 9 * x) * Math.exp(-9 * x);   // smorzamento critico: niente rimbalzo
  const bump = x => Math.sin(Math.PI * clamp(x));
  const rgb = h => h.startsWith('rgb') ? h.match(/\d+/g).map(Number) : [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
  const mix = (a, b, k) => { const A = rgb(a), B = rgb(b); return `rgb(${A.map((v, i) => Math.round(lerp(v, B[i], clamp(k)))).join(',')})`; };
  const maskY = (t, a, d, b, e, dir = 1) => {
    if (t < a) return 110;
    let y = 110 * (1 - eOut(p(t, a, a + d)));
    if (b != null && t >= b) y = 110 * dir * eIn(p(t, b, b + e));
    return y;
  };
  const f1 = v => v.toFixed(1);

  /* ---------- Forme ---------- */
  const SQ = a => Math.pow(Math.pow(Math.abs(Math.cos(a)), 6) + Math.pow(Math.abs(Math.sin(a)), 6), -1 / 6);
  const CI = () => 1;
  const FL = a => 1 + .13 * Math.sin(6 * a);
  const BL = a => 1 + .09 * Math.sin(3 * a + 1) + .05 * Math.sin(5 * a + 2.2);
  const N = 180;
  const rAt = (a, R, A, B, k, rot, hand) => { let r = R * lerp(A(a + rot), B(a + rot), k); if (hand) r = r * 1.1 + Math.sin(11 * a) * 5 + Math.sin(23 * a + 1) * 3; return r; };
  function shape(cx, cy, R, A, B, k, rot = 0, hand = false) {
    if (R < .5) return 'M0 0';
    let d = '';
    for (let j = 0; j < N; j++) {
      const a = j / N * TAU, r = rAt(a, R, A, B, k, rot, hand);
      d += (j ? 'L' : 'M') + f1(cx + r * Math.cos(a)) + ' ' + f1(cy + r * Math.sin(a));
    }
    return d + 'Z';
  }
  const svgEl = (w, h, inner) => `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true">${inner}</svg>`;

  /* ---------- Costruzione del DOM ---------- */
  const $ = s => document.querySelector(s), E = id => document.getElementById(id);
  const stage = $('#stage');
  const nameEl = $('#name');
  'LIKEMOMMADEME'.split('').forEach(ch => {
    const m = document.createElement('span'); m.className = 'mask';
    const c = document.createElement('span'); c.textContent = ch;
    m.appendChild(c); nameEl.appendChild(m);
  });
  const masks = [...nameEl.children], letters = masks.map(m => m.firstChild);
  const group = i => i < 4 ? 0 : i < 7 ? 1 : i < 11 ? 2 : 3;   // LIKE | MOM | MADE | ME

  const worldsEl = $('#worlds');
  WORLDS.forEach((w, i) => {
    const d = document.createElement('div'); d.className = 'w'; d.style.left = ROW_X[i] + 'px';
    d.innerHTML = `<span class="mask"><span>${w.label}</span></span><i style="background:${w.col}"></i>`;
    worldsEl.appendChild(d);
  });
  const worldEls = [...worldsEl.children];

  // Titoli dei mondi, lettera per lettera, con una riga sotto
  const bigEl = E('big');
  WORLDS.forEach(w => {
    if (!w.big) return;
    const d = document.createElement('div'); d.className = 'word'; d.style.color = w.col;
    w.big.split('').forEach(ch => { const m = document.createElement('span'); m.className = 'mask'; const c = document.createElement('span'); c.textContent = ch === ' ' ? ' ' : ch; m.appendChild(c); d.appendChild(m); });
    const cap = document.createElement('div'); cap.className = 'cap'; cap.innerHTML = `<span class="mask"><span>${w.cap}</span></span>`;
    bigEl.appendChild(d); bigEl.appendChild(cap);
    w.el = d; w.letters = [...d.querySelectorAll('.mask > span')]; w.capEl = cap; w.capIn = cap.querySelector('.mask > span');
  });

  // Brand Identity: nove quadrati 2D, poi gli stessi come blocchi 3D
  const NS = 'http://www.w3.org/2000/svg', sqsEl = E('sqs'), sqs = [];
  for (let k = 0; k < 9; k++) {
    const r = document.createElementNS(NS, 'rect'); sqsEl.appendChild(r);
    sqs.push({ el: r, i: (k % 3) - 1, j: Math.floor(k / 3) - 1, k });
  }
  const H1 = [180, 320, 240, 420, 560, 300, 380, 260, 480].map(h => h * .7);
  const H2 = [460, 200, 380, 260, 300, 520, 220, 420, 280].map(h => h * .7);
  const RISE = [4, 1, 3, 5, 0, 7, 2, 6, 8];       // ordine in cui si alzano

  // Generatore AI: quattro risultati (il secondo è la forma che prosegue)
  const AI = { x: 410, y: 190 }, SEL = { x: AI.x + 40 + 261 + 118.5, y: AI.y + 200 + 200, R: 70, rot: 1.35 };
  const CHIP = { x: AI.x + 40 + 42, y: AI.y + 80 + 42 };
  const resArt = [
    [BLUE, `<text x="118.5" y="250" text-anchor="middle" font-family="Cabinet Grotesk" font-weight="900" font-size="230" fill="${PAPER}">L</text>`],
    [INK, `<path d="${shape(118.5, 200, SEL.R, BL, BL, 0, SEL.rot)}" fill="${PINK}"/>`],
    [GREEN, `<circle cx="94" cy="180" r="11" fill="${INK}"/><circle cx="144" cy="180" r="11" fill="${INK}"/><path d="M84 222Q119 266 154 222" fill="none" stroke="${INK}" stroke-width="12" stroke-linecap="round"/>`],
    [PAPER, [0, 1, 2, 3, 4, 5, 6, 7, 8].map(k => `<rect x="${44 + (k % 3) * 52}" y="${126 + Math.floor(k / 3) * 52}" width="44" height="44" rx="10" ${k % 2 ? `fill="${PINK}"` : `fill="none" stroke="${PINK}" stroke-width="4"`}/>`).join('')]
  ];
  const resultsEl = E('results');
  resArt.forEach(([bg, art], i) => {
    const r = document.createElement('div'); r.className = 'abs res';
    r.style.left = (40 + 261 * i) + 'px'; r.style.background = bg;
    r.innerHTML = svgEl(237, 400, art);
    resultsEl.appendChild(r);
  });
  const results = [...resultsEl.children];
  // tempi del generatore, espressi nel tempo "locale" del mondo (u = t - 2)
  const CURSOR_KEYS = [[6.25, 1580, 1000], [6.5, 760, 318], [6.95, 1372, 318], [7.02, 1372, 318], [7.42, SEL.x, SEL.y + 40], [7.52, SEL.x, SEL.y + 40], [7.85, 1100, 1160]];
  const CLICKS = [6.5, 7.02, 7.52];

  // Motion Design: parola cinetica
  const kinEl = E('kin');
  'MOTION'.split('').forEach(ch => { const s = document.createElement('span'); s.textContent = ch; kinEl.appendChild(s); });
  const kin = [...kinEl.children];

  // Grafico a barre del telefono
  const chart = E('chart'), BARS = [110, 170, 80, 200, 140];
  BARS.forEach((h, i) => {
    const b = document.createElement('b'); b.style.left = (i * 70) + 'px'; b.style.height = h + 'px';
    b.style.background = i === 3 ? BLUE : INK; chart.appendChild(b);
  });
  const bars = [...chart.children];

  const el = {
    blob: E('blob'), contour: E('contour'), face: E('face'), eyeL: E('eyeL'), eyeR: E('eyeR'), smile: E('smile'), pen: E('pen'),
    grid: E('grid'), gridParts: [...E('grid').children], boxes: E('boxes'), sqs: sqsEl,
    graph: E('graph'), tl: E('tl'), kfs: [...document.querySelectorAll('.kf')],
    role: $('#role .mask > span'), sq1: E('sq1'), sq2: E('sq2'), mark: $('#mark .mask > span'),
    ptext: E('ptext'), caret: $('#ftext .caret'), fbar: E('fbar'), ai: E('ai'), gen: E('gen'), cursor: E('cursor'), cam: E('cam'), kin: kinEl,
    phone: E('phone'), pfill: E('pfill'), pcontent: E('pcontent'), ptitle: $('#ptitle .mask > span'),
    track: E('track'), sfill: E('sfill'), sknob: E('sknob'), sval: E('sval'), btn: E('btn')
  };
  const PROMPT = 'un poster per la mamma, stile pop, 4 varianti';
  let M = null;   // misure prese una volta, a riposo

  function measure() {
    const s0 = stage.getBoundingClientRect(), S = s0.width / 1920;
    const box = n => { const b = n.getBoundingClientRect(); return { l: (b.left - s0.left) / S, r: (b.right - s0.left) / S, t: (b.top - s0.top) / S, b: (b.bottom - s0.top) / S }; };
    const r = letters.map(box), k = kin.map(box), cy = (r[0].t + r[0].b) / 2;
    M = { Lcx: (r[0].l + r[0].r) / 2, Lcy: cy, cy, L: r[0],
          gaps: [[3, 4], [6, 7], [10, 11]].map(([a, c], n) => ((r[a].r + GOFF[n] * G) + (r[c].l + GOFF[n + 1] * G)) / 2),
          kx: k.map(b => (b.l + b.r) / 2), ky: (k[0].t + k[0].b) / 2 };
    // titoli: larghi al massimo 760 px, centrati in verticale nello spazio a sinistra
    WORLDS.forEach(w => {
      if (!w.el) return;
      w.el.style.fontSize = '100px';
      const width = w.letters.reduce((a, c) => a + c.getBoundingClientRect().width / S, 0);
      const size = Math.min(230, (w.maxW || 760) / Math.max(1, width) * 100);
      w.el.style.fontSize = size + 'px';
      const top = 470 - size * .8 / 2 - 30;
      w.el.style.top = top + 'px'; w.capEl.style.top = (top + size * .8 + 34) + 'px';
    });
  }

  const vis = (node, on) => { node.style.visibility = on ? 'visible' : 'hidden'; };
  const dash = (node, k) => { node.style.strokeDasharray = '1 1'; node.style.strokeDashoffset = String(1 - clamp(k)); };

  /* ---------- Camera ---------- */
  function camAt(t) {
    const u = t - 2;
    const shift = SHIFT * (eIO(p(t, 1.9, 2.3)) - eIO(p(t, 9.9, 10.2)) + eIO(p(t, 11.8, 12.1)) - eIO(p(t, 13.9, 14.2)));
    let z = 1, fx = 960 - shift, fy = 540;
    if (u >= 6.4 && u < 8) {                     // zoom alla Screen Studio sul generatore
      const zin = eIO(p(u, 6.42, 6.72)), zout = eIO(p(u, 6.98, 7.3)), k = zin * (1 - zout);
      z = 1 + .38 * k + .05 * p(u, 6.72, 6.98) * (1 - zout);
      fx = lerp(fx, 820, k); fy = lerp(540, CHIP.y, k);
      const k2 = eIO(p(u, 7.38, 7.55)) * (1 - eIO(p(u, 7.6, 7.95)));
      z += .14 * k2; fx = lerp(fx, SEL.x, k2); fy = lerp(fy, SEL.y, k2);
    }
    const push = t >= 2 && t < 14 ? .025 * Math.pow(Math.sin(Math.PI * t / 2), 2) : 0;
    z *= 1 + push + .014 * Math.exp(-12 * (t % BEAT));
    return { z, fx, fy };
  }

  /* ---------- La forma che attraversa i mondi ---------- */
  function blobAt(t) {
    const s = { cx: 960, cy: 500, R: 0, A: SQ, B: SQ, k: 0, col: BLUE, rot: 0 };
    if (t < 2) return s;
    if (t < 3) { s.R = 260 * spring(p(t, 2, 2.45)); return s; }           // il monogramma
    if (t < 5.85) return s;                                                  // diviso nei quadrati e nei blocchi
    if (t < 6.15) { const m = eIO(p(t, 5.85, 6.15)); s.R = lerp(75, 240, m); s.B = CI; s.k = m; s.col = mix(PINK, GREEN, m); return s; }
    const u = t - 2;                                                         // da qui i tempi dei mondi successivi
    s.col = GREEN; s.R = 240; s.A = s.B = CI;
    if (u < 5) return s;
    if (u < 5.5) { s.B = FL; s.k = spring(p(u, 5, 5.4)); s.rot = (u - 5) * .6; return s; }
    if (u < 6) { s.A = FL; s.B = BL; s.k = spring(p(u, 5.5, 5.9)); s.rot = .3 + (u - 5.5) * .6; return s; }
    s.A = s.B = BL;
    if (u < 7.5) { const m = eIO(p(u, 6, 6.35)); s.cx = lerp(960, CHIP.x, m); s.cy = lerp(500, CHIP.y, m); s.R = lerp(240, 26, m) * (1 - eIn(p(u, 7.02, 7.16))); s.rot = lerp(.6, SEL.rot, m); return s; }
    s.col = PINK; s.rot = SEL.rot;
    if (u < 8) { const m = eIO(p(u, 7.6, 8)); s.cx = lerp(SEL.x, 960, m); s.cy = lerp(SEL.y, 500, m); s.R = lerp(SEL.R, 200, m); return s; }
    if (u < 8.5) { const m = eIO(p(u, 8, 8.4)); s.cx = lerp(960, 510, m); s.cy = lerp(500, 830, m); s.R = lerp(200, 24, m); s.B = CI; s.k = m; return s; }
    s.A = s.B = CI; s.R = 24; s.cy = 830;
    if (u < 9.95) { s.cx = 510 + 900 * p(u, 8.5, 9.5); return s; }
    if (u < 12) {
      const m = eIO(p(u, 9.95, 10.35)), on = spring(p(u, 10.5, 10.85));
      s.cx = lerp(1410, lerp(KOFF, KON, on), m); s.cy = lerp(830, KY, m); s.R = lerp(24, 16, m);
      s.col = u < 10.5 ? mix(PINK, INK, m) : mix(INK, PAPER, eOut(p(u, 10.5, 10.75)));
      return s;
    }
    s.cx = KON; s.cy = KY; s.col = PAPER; s.R = 16 * (1 - eIn(p(u, 12, 12.2)));
    return s;
  }

  /* ---------- Brand: i blocchi 3D (proiezione prospettica, ordinamento del pittore) ---------- */
  function drawBoxes(t) {
    const th = (90 - 44 * eIO(p(t, 4, 4.45)) + 44 * eIO(p(t, 5.5, 5.85))) * Math.PI / 180;
    const yaw = (32 * eIO(p(t, 4.5, 4.95)) - 60 * eIO(p(t, 5, 5.45)) + 28 * eIO(p(t, 5.5, 5.85))) * Math.PI / 180;
    const D = 2200, F = 2200, cT = Math.cos(th), sT = Math.sin(th), cY = Math.cos(yaw), sY = Math.sin(yaw);
    const cam = [-D * cT * sY, D * sT, -D * cT * cY];
    const proj = ([x, y, z]) => {
      const xr = x * cY - z * sY, zr = x * sY + z * cY;
      const d = zr * cT - y * sT, u = y * cT + zr * sT, s = F / (D + d);
      return [960 + xr * s, 500 - u * s, d];
    };
    const sink = 1 - eIO(p(t, 5.5, 5.8));
    const boxes = sqs.map(q => {
      const o = RISE.indexOf(q.k);
      const h = lerp(H1[q.k], H2[q.k], eIO(p(t, 5 + .02 * o, 5.35 + .02 * o))) * spring(p(t, 4.05 + .035 * o, 4.45 + .035 * o)) * sink;
      const b = { x: q.i * 168, z: -q.j * 168, w: 150, h, col: q.k === 4 ? PINK : BLUE };
      b.depth = proj([b.x, h / 2, b.z])[2];
      return b;
    }).sort((a, b) => b.depth - a.depth);
    let out = '';
    boxes.forEach(b => {
      const x0 = b.x - 75, x1 = b.x + 75, z0 = b.z - 75, z1 = b.z + 75, y1 = Math.max(0, b.h);
      const fs = [{ v: [[x0, y1, z0], [x1, y1, z0], [x1, y1, z1], [x0, y1, z1]], n: [0, 1, 0], c: [b.x, y1, b.z], col: mix(b.col, PAPER, .22 * clamp(b.h / 60)) }];
      if (y1 > .5) fs.push(
        { v: [[x0, 0, z0], [x1, 0, z0], [x1, y1, z0], [x0, y1, z0]], n: [0, 0, -1], c: [b.x, y1 / 2, z0], col: b.col },
        { v: [[x0, 0, z1], [x1, 0, z1], [x1, y1, z1], [x0, y1, z1]], n: [0, 0, 1], c: [b.x, y1 / 2, z1], col: mix(b.col, INK, .5) },
        { v: [[x0, 0, z0], [x0, 0, z1], [x0, y1, z1], [x0, y1, z0]], n: [-1, 0, 0], c: [x0, y1 / 2, b.z], col: mix(b.col, INK, .32) },
        { v: [[x1, 0, z0], [x1, 0, z1], [x1, y1, z1], [x1, y1, z0]], n: [1, 0, 0], c: [x1, y1 / 2, b.z], col: mix(b.col, INK, .32) });
      fs.forEach(fc => {
        if (fc.n[0] * (cam[0] - fc.c[0]) + fc.n[1] * (cam[1] - fc.c[1]) + fc.n[2] * (cam[2] - fc.c[2]) <= 0) return;
        out += `<polygon points="${fc.v.map(proj).map(q => f1(q[0]) + ',' + f1(q[1])).join(' ')}" fill="${fc.col}" stroke="${fc.col}" stroke-width=".8" stroke-linejoin="round"/>`;
      });
    });
    el.boxes.innerHTML = out;
  }

  /* ---------- seek(t): ogni stile dipende solo dal tempo ---------- */
  function seek(t) {
    if (!M) return;
    const u = t - 2;   // tempo dei mondi dopo il Brand (scritti sulla timeline originale)

    const cm = camAt(t);
    el.cam.style.transform = `translate(960px, 540px) scale(${cm.z}) translate(${-cm.fx}px, ${-cm.fy}px)`;

    /* Nome, ruolo, quadratini (battuta 1 e chiusura) */
    for (let i = 0; i < 13; i++) {
      const m = masks[i], c = letters[i];
      if (i === 0 && t >= 1.5 && t < 14) {
        m.style.overflow = 'visible'; vis(c, t < 3.05);
        if (t >= 3.05) continue;
        const mv = eIO(p(t, 1.5, 2.1));
        const s = lerp(1, 2.3, mv) * (1 - eIn(p(t, 2.9, 3.05)));
        c.style.transformOrigin = '50% 50%';
        c.style.transform = `translate(${lerp(GOFF[0] * G, 960 - M.Lcx, mv)}px, ${lerp(0, 500 - M.Lcy, mv)}px) scale(${s})`;
        continue;
      }
      m.style.overflow = t < 1.45 ? 'visible' : 'hidden';
      let x = 0, y = 0, sy = 1, jump = 0;
      if (t < 2) {
        sy = 1 + .25 * bump(p(t, .035 * i, .035 * i + .4));
        jump = -14 * bump(p(t, .5 + .035 * (12 - i), .5 + .035 * (12 - i) + .4));
        x = GOFF[group(i)] * G * eIO(p(t, .95, 1.45));
        if (i > 0) y = 115 * eIO(p(t, 1.5 + .02 * i, 1.9 + .02 * i));
      } else if (t < 14) { y = 115; }
      else { y = 115 * (1 - eOut(p(t, 14.3 + .02 * i, 14.75 + .02 * i))); }
      vis(c, y < 114);
      c.style.transformOrigin = '50% 100%';
      c.style.transform = `translate(${x}px, ${y + jump}%) scaleY(${sy})`;
    }
    let ry = 0;
    if (t >= 1.5 && t < 14) ry = t < 2 ? 115 * eIn(p(t, 1.55, 1.9)) : 115;
    else if (t >= 14) ry = 115 * (1 - eOut(p(t, 14.45, 14.9)));
    el.role.style.transform = `translateY(${ry}%)`;
    [E('sq1'), E('sq2'), E('sq3')].forEach((q, n) => {
      const on = t >= 1 && t < 2; vis(q, on); if (!on) return;
      const room = clamp((eIO(p(t, .95, 1.45)) - .55) / .45);   // il quadratino entra solo quando lo spazio tra le parole c'è
      const s = spring(p(t, 1.15 + .05 * n, 1.5 + .05 * n)) * room, dy = 420 * eIO(p(t, 1.55 + .03 * n, 1.95 + .03 * n));
      q.style.transform = `translate(${M.gaps[n] - 32}px, ${M.cy - 32 + dy}px) rotate(${[-6, 4, -3][n]}deg) scale(${s})`;
    });

    /* Cornice: marchio, riga dei mondi, titoli */
    el.mark.style.transform = `translateY(${maskY(t, 2, .4, 13.9, .3)}%)`;
    const active = WORLDS.findIndex(w => t >= w.t0 && t < w.t1);
    worldEls.forEach((d, i) => {
      d.firstChild.firstChild.style.transform = `translateY(${maskY(t, 2.1 + .04 * i, .4, 14 + .03 * i, .3)}%)`;
      d.style.color = active === i ? PAPER : '#5E5E5E';
      d.lastChild.style.transform = `scaleX(${active === i ? eOut(p(t, WORLDS[i].t0, WORLDS[i].t0 + .3)) : 0})`;
    });
    WORLDS.forEach(w => {
      if (!w.el) return;
      const end = w.bigEnd || w.t1, on = t >= w.t0 && t < end + .2; vis(w.el, on); vis(w.capEl, on);
      if (!on) return;
      w.letters.forEach((c, j) => { c.style.transform = `translateY(${maskY(t, w.t0 + .025 * j, .32, end - .22 + .012 * j, .16, -1)}%)`; });
      w.capIn.style.transform = `translateY(${maskY(t, w.t0 + .2, .35, end - .22, .16, -1)}%)`;
    });

    /* La forma */
    const b = blobAt(t);
    el.blob.setAttribute('d', shape(b.cx, b.cy, b.R, b.A, b.B, b.k, b.rot));
    el.blob.setAttribute('fill', b.col);

    /* Brand Identity: monogramma, griglia di costruzione, quattro quarti, nove quadrati, blocchi 3D */
    const gOn = t >= 2.4 && t < 3.15; vis(el.grid, gOn);
    if (gOn) {
      el.grid.setAttribute('transform', 'translate(960 500)');
      el.gridParts.forEach((g, j) => dash(g, eOut(p(t, 2.4 + .05 * j, 2.75 + .05 * j)) * (1 - eIn(p(t, 2.88 + .02 * j, 3.1 + .02 * j)))));
    }
    const qOn = (t >= 3 && t < 4.02) || (t >= 5.85 && t < 6.1); vis(el.sqs, qOn);
    if (qOn) sqs.forEach(q => {
      const corner = q.i !== 0 && q.j !== 0, center = q.i === 0 && q.j === 0;
      let s = 0, off = 168, rot = 0, col = center ? PINK : BLUE;
      if (t < 3.25) {                                       // quattro quarti che si staccano e ruotano
        if (corner) { const k = spring(p(t, 3, 3.25)); off = lerp(130, 150, k); s = lerp(260, 232, k); rot = 90 * eIO(p(t, 3, 3.25)); }
      } else if (t < 4.02) {                                // diventano una griglia 3 x 3
        if (corner) { const k = spring(p(t, 3.25, 3.55)); off = lerp(150, 168, k); s = lerp(232, 150, k); }
        else if (center) s = 150 * spring(p(t, 3.5, 3.78));
        else { const o = [1, 3, 5, 7].indexOf(q.k); s = 150 * spring(p(t, 3.3 + .04 * o, 3.58 + .04 * o)); }
      } else {                                              // tornano piatti e rientrano: il rosa diventa la forma
        const c = eIn(p(t, 5.85 + .012 * q.k, 6.05 + .012 * q.k)); s = center ? 0 : 150 * (1 - c); off = 168 * (1 - c);
      }
      if (center) off = 0;
      const x = 960 + q.i * off, y = 500 + q.j * off;
      q.el.setAttribute('x', f1(x - s / 2)); q.el.setAttribute('y', f1(y - s / 2));
      q.el.setAttribute('width', f1(Math.max(0, s))); q.el.setAttribute('height', f1(Math.max(0, s)));
      q.el.setAttribute('fill', col);
      q.el.setAttribute('transform', `rotate(${rot.toFixed(2)} ${f1(x)} ${f1(y)})`);
    });
    const bxOn = t >= 4 && t < 5.85; vis(el.boxes, bxOn);
    if (bxOn) drawBoxes(t);

    /* Illustration: una matita disegna il contorno e il sorriso */
    const iOn = u >= 4.1 && u < 6; vis(el.contour, iOn);
    const draw = eOut(p(u, 4.15, 4.6));
    if (iOn) {
      el.contour.setAttribute('d', shape(b.cx, b.cy, b.R, b.A, b.B, b.k, b.rot, true));
      dash(el.contour, draw * (1 - eIn(p(u, 5.6, 5.95))));
    }
    const fs = spring(p(u, 4.55, 4.85)) * (1 - eIn(p(u, 5.45, 5.75)));
    vis(el.face, fs > .001);
    if (fs > .001) {
      el.face.setAttribute('transform', `translate(${b.cx} ${b.cy}) scale(${fs})`);
      el.eyeL.setAttribute('transform', 'translate(-72 -40)');
      el.eyeR.setAttribute('transform', `translate(72 -40) scale(1 ${1 - .9 * bump(p(u, 5, 5.22))})`);
      dash(el.smile, eOut(p(u, 4.62, 4.98)));
    }
    const penOn = u >= 4.1 && u < 5.3; vis(el.pen, penOn);
    if (penOn) {
      let px, py;
      if (u < 4.6) { const a = draw * TAU, r = rAt(a, b.R, b.A, b.B, b.k, b.rot, true); px = b.cx + r * Math.cos(a); py = b.cy + r * Math.sin(a); }
      else if (u < 5) {
        const s = eOut(p(u, 4.62, 4.98)), qx = (1 - s) * (1 - s) * -84 + 2 * (1 - s) * s * 0 + s * s * 84, qy = (1 - s) * (1 - s) * 40 + 2 * (1 - s) * s * 128 + s * s * 40;
        const k = eIO(p(u, 4.58, 4.66)), [ax, ay] = [b.cx + b.R * 1.1, b.cy];
        px = lerp(ax, b.cx + qx, k); py = lerp(ay, b.cy + qy, k);
      } else { const k = eIn(p(u, 5, 5.3)); px = b.cx + 84 + 600 * k; py = b.cy + 40 + 500 * k; }
      if (u < 4.2) { const k = eOut(p(u, 4.1, 4.2)); px = lerp(px + 500, px, k); py = lerp(py + 400, py, k); }
      el.pen.setAttribute('transform', `translate(${f1(px)} ${f1(py)})`);
    }

    /* Generative AI: il cursore guida il generatore, i risultati emergono dalla sfocatura */
    const aOn = u >= 6 && u < 7.95; vis(el.ai, aOn);
    if (aOn) {
      const k = eOut(p(u, 6, 6.35)), out = eIn(p(u, 7.6, 7.92)), ins = 50 * (1 - k) + 50 * out;
      el.ai.style.clipPath = `inset(${ins}% 0 ${ins}% 0 round 24px)`;
      el.ptext.textContent = PROMPT.slice(0, Math.round(PROMPT.length * p(u, 6.52, 6.95)));
      vis(el.caret, u >= 6.5 && u < 7.02 && (u < 6.95 || (u * 4 | 0) % 2 === 0));
      el.gen.style.transform = `scale(${1 - .1 * bump(p(u, 7.02, 7.18))})`;
      el.gen.style.background = u >= 7.02 && u < 7.4 ? PAPER : PINK;
      el.gen.textContent = u >= 7.02 && u < 7.4 ? 'Genero…' : 'Genera';
      el.fbar.style.transform = `scaleX(${u >= 7.02 && u < 7.42 ? eOut(p(u, 7.02, 7.4)) : 0})`;
      results.forEach((r, i) => {
        const a = 7.06 + .07 * i, kk = eOut(p(u, a, a + .34)), on = u >= a; vis(r, on);
        if (!on) return;
        r.style.transform = `scale(${lerp(.86, 1, kk)})`;
        r.style.filter = kk < .995 ? `blur(${f1(26 * (1 - kk))}px) saturate(${f1(kk)})` : 'none';
        r.style.boxShadow = i === 1 ? `inset 0 0 0 ${4 * eOut(p(u, 7.52, 7.6))}px ${PINK}` : 'none';
        vis(r.firstChild, !(i === 1 && u >= 7.52));
      });
    }
    const curOn = u >= 6.25 && u < 7.85; vis(el.cursor, curOn);
    if (curOn) {
      let j = 0; while (j < CURSOR_KEYS.length - 2 && u >= CURSOR_KEYS[j + 1][0]) j++;
      const [t0, x0, y0] = CURSOR_KEYS[j], [t1, x1, y1] = CURSOR_KEYS[j + 1], m = eIO(p(u, t0, t1));
      const press = CLICKS.reduce((a, c) => a * (1 - .2 * bump(p(u, c - .02, c + .12))), 1);
      el.cursor.style.transform = `translate(${lerp(x0, x1, m) - 6}px, ${lerp(y0, y1, m) - 4}px) scale(${press})`;
    }

    /* Motion Design: timeline e parola cinetica che reagisce alla testina, con la scia */
    const mOn = u >= 8 && u < 10; vis(el.graph, mOn);
    if (mOn) {
      const out = 1 - eIn(p(u, 9.6, 9.9));
      dash(el.tl, eOut(p(u, 8, 8.4)) * out);
      el.kfs.forEach((kf, i) => {
        const s = spring(p(u, 8.5 + .5 * i, 8.75 + .5 * i)) * out * (1 + .35 * bump(p(u, 8.5 + .5 * i, 8.7 + .5 * i)));
        kf.setAttribute('transform', `translate(${510 + 450 * i} 830) rotate(45) scale(${s})`);
        kf.setAttribute('fill', b.cx >= 510 + 450 * i - 4 && u >= 8.5 ? PINK : PAPER);
      });
    }
    const kOn = u >= 8.25 && u < 9.95; vis(el.kin, kOn);
    if (kOn) {
      kin.forEach((L, j) => {
        const a = 8.28 + .05 * j, pos = q => 1100 * (1 - eOut(p(q, a, a + .42)));
        const x = pos(u), v = (pos(u - 1 / 60) - x) * 60;
        const near = u >= 8.5 && u < 9.55 ? Math.max(0, 1 - Math.abs(b.cx - M.kx[j]) / 130) : 0;
        const ex = eIn(p(u, 9.5 + .04 * j, 9.82 + .04 * j));
        const tx = x + (1410 - M.kx[j]) * ex, ty = -70 * spring(near) + (830 - M.ky) * ex;
        L.style.transform = `translate(${f1(tx)}px, ${f1(ty)}px) skewX(${-Math.min(18, v * .004)}deg) scale(${(1 - ex) * (1 + .12 * near)})`;
        const blur = Math.min(18, v * .005);
        L.style.filter = blur > .4 ? `blur(${f1(blur)}px)` : 'none';
        const e1 = Math.min(120, v * .05), e2 = Math.min(240, v * .1);
        L.style.textShadow = e1 > 2 ? `${f1(e1)}px 0 0 rgba(245,245,242,.28), ${f1(e2)}px 0 0 rgba(245,245,242,.12)` : 'none';
        L.style.color = near > .02 ? mix(PAPER, PINK, near * 1.6) : PAPER;
      });
    }

    /* UI/UX Design: la timeline diventa lo schermo; alla fine lo schermo si stringe nella L del nome */
    const phOn = u >= 9.75 && u < 12.36; vis(el.phone, phOn);
    if (phOn) {
      let r, rad;
      if (u < 10.25) {
        const m = eIO(p(u, 9.75, 10.25));
        r = { x: lerp(510, P.x, m), y: lerp(826, P.y, m), w: lerp(900, P.w, m), h: lerp(8, P.h, m) }; rad = lerp(4, 48, m);
      } else if (u < 12) { r = P; rad = 48; }
      else {
        const m = eIO(p(u, 12, 12.34)), L = M.L;
        r = { x: lerp(P.x, L.l + 6, m), y: lerp(P.y, L.t + 20, m), w: lerp(P.w, 34, m), h: lerp(P.h, L.b - L.t - 40, m) }; rad = lerp(48, 4, m);
      }
      Object.assign(el.phone.style, { left: r.x + 'px', top: r.y + 'px', width: r.w + 'px', height: r.h + 'px', borderRadius: rad + 'px' });
      el.phone.style.boxShadow = `inset 0 0 0 3px ${PAPER}`;
      el.pfill.style.transform = `scaleY(${eOut(p(u, 10, 10.35))})`;
      el.pcontent.style.transform = `scale(${1 - eIn(p(u, 12, 12.2))})`;
      vis(el.pcontent, u < 12.2);
      el.ptitle.style.transform = `translateY(${maskY(u, 10.25, .35)}%)`;
      const on = eOut(p(u, 10.5, 10.75));
      el.track.style.background = u < 10.25 ? 'transparent' : mix(TRACK, BLUE, on);
      bars.forEach((bar, i) => { bar.style.transform = `scaleY(${eOut(p(u, 10.5 + .07 * i, 10.9 + .07 * i))})`; });
      const v = lerp(.15, .9, eOut(p(u, 11, 11.45)));
      el.sfill.style.transform = `scaleX(${v})`;
      el.sknob.style.transform = `translateX(${v * 348}px)`;
      el.sval.textContent = Math.round(v * 100) + '%';
      const press = 1 - .07 * bump(p(u, 11.5, 11.72));
      el.btn.style.transform = `translateY(${110 * (1 - eOut(p(u, 10.75, 11.1)))}%) scale(${press})`;
      el.btn.textContent = u >= 11.6 ? 'Fatto!' : 'Avanti';
    }
  }

  /* ---------- Orologio, comandi, suono ---------- */
  const qs = new URLSearchParams(location.search);
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (qs.has('clean')) document.body.classList.add('clean');
  const embed = qs.has('embed');   // dentro l'header del sito: il tempo arriva dalla pagina che lo contiene
  const scrollMode = embed || (!qs.has('play') && !qs.has('t') && !reduced);
  if (embed) document.body.classList.add('embed');
  else if (scrollMode) { document.body.classList.add('scroll'); document.documentElement.classList.add('scroll'); }
  let embedTarget = 0;
  if (embed) addEventListener('message', e => {
    if (e.origin === location.origin && e.data && typeof e.data.reel === 'number') embedTarget = reduced ? 0 : clamp(e.data.reel) * DUR;
  });
  let playing = !(reduced || qs.has('t')) && !scrollMode, sound = false, ctx = null, master = null, noise = null;
  let base = qs.has('t') ? parseFloat(qs.get('t')) || 0 : 0, ref = 0, nextBeat = 0, dragging = false;
  const clock = () => sound && ctx ? ctx.currentTime : performance.now() / 1000;
  const nowT = () => playing ? base + (clock() - ref) : base;
  const rebase = t => { base = t; ref = clock(); nextBeat = Math.ceil((t - 1e-6) / BEAT) * BEAT; };

  function initAudio() {
    ctx = new AudioContext(); master = ctx.createGain(); master.gain.value = .5; master.connect(ctx.destination);
    noise = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate);
    const d = noise.getChannelData(0); let seed = 7;
    for (let i = 0; i < d.length; i++) { seed = (seed * 16807) % 2147483647; d[i] = seed / 1073741823.5 - 1; }
  }
  const env = (g, at, peak, len) => { g.gain.setValueAtTime(peak, at); g.gain.exponentialRampToValueAtTime(.001, at + len); };
  function kick(at, strong) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.frequency.setValueAtTime(150, at); o.frequency.exponentialRampToValueAtTime(42, at + .13);
    env(g, at, strong ? .95 : .7, .28); o.connect(g).connect(master); o.start(at); o.stop(at + .3);
  }
  function hit(at) {
    const n = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain();
    n.buffer = noise; f.type = 'highpass'; f.frequency.value = 2500; env(g, at, .3, .18);
    n.connect(f).connect(g).connect(master); n.start(at); n.stop(at + .2);
    const o = ctx.createOscillator(), g2 = ctx.createGain(); o.type = 'triangle'; o.frequency.value = 220;
    env(g2, at, .22, .25); o.connect(g2).connect(master); o.start(at); o.stop(at + .3);
  }
  function riser(at, len) {
    const n = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain();
    n.buffer = noise; n.loop = true; f.type = 'bandpass'; f.Q.value = 6;
    f.frequency.setValueAtTime(300, at); f.frequency.exponentialRampToValueAtTime(6000, at + len);
    g.gain.setValueAtTime(.0001, at); g.gain.exponentialRampToValueAtTime(.35, at + len); g.gain.linearRampToValueAtTime(0, at + len + .03);
    n.connect(f).connect(g).connect(master); n.start(at); n.stop(at + len + .05);
  }
  function chime(at) {
    [880, 1320].forEach((fq, i) => { const o = ctx.createOscillator(), g = ctx.createGain(); o.frequency.value = fq; env(g, at, .16 - i * .06, .6); o.connect(g).connect(master); o.start(at); o.stop(at + .65); });
  }
  function schedule(tu) {
    while (nextBeat < tu + .2) {
      const at = ref + (nextBeat - base);
      if (at >= ctx.currentTime - .01) {
        const bt = Math.round((((nextBeat % DUR) + DUR) % DUR) / BEAT) % 30;
        kick(at, bt % 4 === 0);
        if (bt % 4 === 0) hit(at);
        if (bt === 6) riser(at, 1);              // verso i blocchi 3D
        if (bt === 28) chime(at);
      }
      nextBeat += BEAT;
    }
  }

  const pp = E('pp'), scrub = E('scrub'), tc = E('tc'), snd = E('snd');
  const setPlaying = on => { if (on === playing) return; const t = nowT(); playing = on; rebase(t); pp.textContent = on ? 'Pausa' : 'Play'; if (ctx) on && sound ? ctx.resume() : ctx.suspend(); };
  pp.textContent = playing ? 'Pausa' : 'Play';
  pp.onclick = () => setPlaying(!playing);
  if (!scrollMode) stage.onclick = () => setPlaying(!playing);
  scrub.oninput = () => { dragging = true; rebase(parseFloat(scrub.value)); };
  scrub.onchange = () => { dragging = false; };
  snd.onclick = () => {
    if (!ctx) initAudio();
    const t = nowT();
    if (!sound) { ctx.resume().then(() => { sound = true; rebase(t); snd.textContent = 'Suono: sì'; snd.setAttribute('aria-pressed', 'true'); }); }
    else { sound = false; rebase(t); ctx.suspend(); snd.textContent = 'Suono: no'; snd.setAttribute('aria-pressed', 'false'); }
  };
  addEventListener('keydown', e => {
    if (e.target === scrub || scrollMode) return;
    if (e.code === 'Space') { e.preventDefault(); setPlaying(!playing); }
    if (e.code === 'ArrowRight' || e.code === 'ArrowLeft') { setPlaying(false); rebase(clamp(Math.round(base / BEAT) * BEAT + (e.code === 'ArrowRight' ? BEAT : -BEAT), 0, DUR)); }
  });

  function fit() {
    const uiH = ['clean', 'scroll', 'embed'].some(c => document.body.classList.contains(c)) ? 0 : 56;
    const S = Math.min(innerWidth / 1920, (innerHeight - uiH) / 1080);
    stage.style.transform = `translate(${(innerWidth - 1920 * S) / 2}px, ${(innerHeight - uiH - 1080 * S) / 2}px) scale(${S})`;
  }
  addEventListener('resize', fit); fit();

  // Scroll: il tempo insegue la posizione con una molla a smorzamento critico (accelera e frena, senza scatti né rimbalzi)
  let st = 0, sv = 0, lastNow = 0, lastDrawn = -1;
  const hint = E('hint'), W0 = 7;
  function scrollFrame(now) {
    const max = document.documentElement.scrollHeight - innerHeight;
    const target = embed ? embedTarget : max > 0 ? clamp(scrollY / max) * DUR : 0;
    const dt = lastNow ? Math.min(.05, (now - lastNow) / 1000) : .016; lastNow = now;
    for (let i = 0, h = dt / 4; i < 4; i++) { sv += (W0 * W0 * (target - st) - 2 * W0 * sv) * h; st += sv * h; }
    if (Math.abs(target - st) < .0005 && Math.abs(sv) < .002) { st = target; sv = 0; }
    st = clamp(st, 0, DUR);
    if (st !== lastDrawn) { seek(st); lastDrawn = st; }
    hint.style.opacity = st < .3 ? '1' : '0';
    requestAnimationFrame(scrollFrame);
  }
  function frame() {
    const tu = nowT();
    if (playing && sound) schedule(tu);
    const t = playing ? ((tu % DUR) + DUR) % DUR : clamp(tu, 0, DUR);
    seek(t);
    if (!dragging) scrub.value = t.toFixed(2);
    tc.textContent = t.toFixed(2).padStart(5, '0') + ' / 15';
    requestAnimationFrame(frame);
  }

  window.seek = t => { playing = false; rebase(t); seek(t); };
  const start = () => {
    if (M) return;
    measure(); rebase(base); document.documentElement.dataset.ready = '1';
    requestAnimationFrame(scrollMode ? scrollFrame : frame);
  };
  document.fonts.ready.then(start);
  setTimeout(start, 2500);
})();
</script>
