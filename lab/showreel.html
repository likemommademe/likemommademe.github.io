<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LIKEMOMMADEME Showreel</title>
<meta name="robots" content="noindex">
<meta name="description" content="Showreel di LIKEMOMMADEME, Creative Designer: sei mondi in quindici secondi.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%233D5AFF'/%3E%3Cpath d='M10 7h4v14h8v4H10z' fill='%23F5F5F2'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://api.fontshare.com">
<link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=cabinet-grotesk@500,900&display=swap">
<style>
  :root {
    --ink: #0A0A0A; --paper: #F5F5F2; --muted: #8A8A8A; --line: #262626;
    --blue: #3D5AFF; --green: #12C08E; --pink: #FF3D8B;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }

  #stage {
    position: absolute; left: 0; top: 0; width: 1920px; height: 1080px;
    transform-origin: 0 0; overflow: hidden;
    background: var(--ink); color: var(--paper);
    font-family: "Cabinet Grotesk", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .abs { position: absolute; }
  .mask { display: inline-block; overflow: hidden; vertical-align: top; }
  .mask > span { display: inline-block; }

  /* Nome */
  #name { position: absolute; left: 0; right: 0; top: 372px; text-align: center; white-space: nowrap;
          font-weight: 900; font-size: 190px; line-height: .8; letter-spacing: -.02em; z-index: 5; }
  #name .mask { padding: .1em 0 .04em; margin: -.1em 0 -.04em; }
  #role { position: absolute; left: 0; right: 0; top: 560px; text-align: center;
          font-weight: 500; font-size: 44px; line-height: 1.15; }
  .sq { width: 80px; height: 80px; border-radius: 14px; }

  /* Cornice: marchio e mondi */
  #mark { left: 64px; top: 52px; font-weight: 900; font-size: 30px; line-height: 1; letter-spacing: -.01em; }
  .w { position: absolute; top: 980px; width: 272px; margin-left: -136px; text-align: center;
       font-weight: 500; font-size: 24px; line-height: 1.3; }
  .w .mask { padding-bottom: 14px; }
  .w i { position: absolute; left: 50%; bottom: 0; width: 64px; height: 4px; margin-left: -32px;
         border-radius: 2px; transform: scaleX(0); }

  svg#fx { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: visible; pointer-events: none; z-index: 4; }

  /* Brand Identity */
  #card { left: 1060px; top: 250px; width: 520px; height: 300px; border-radius: 18px;
          background: var(--paper); color: var(--ink); padding: 36px; }
  #card .mono { width: 64px; height: 64px; border-radius: 12px; background: var(--blue); color: var(--paper);
                font-weight: 900; font-size: 48px; line-height: 64px; text-align: center; }
  #card .n { margin-top: 28px; font-weight: 900; font-size: 34px; letter-spacing: -.01em; }
  #card .r { margin-top: 6px; font-weight: 500; font-size: 20px; color: #5E5E5E; }
  #card .bar { position: absolute; right: 36px; top: 36px; width: 120px; height: 10px; border-radius: 5px; background: #DADAD5; }
  #card .bar + .bar { top: 56px; width: 80px; }
  #palette { left: 1060px; top: 600px; display: flex; gap: 22px; }
  #palette span { width: 96px; height: 96px; border-radius: 50%; }

  /* Generative AI */
  #prompt { left: 0; right: 0; top: 98px; text-align: center; font-weight: 500; font-size: 34px; line-height: 1.2; }
  #prompt .caret { display: inline-block; width: 4px; height: 34px; margin-left: 6px; vertical-align: -5px; background: var(--pink); }
  .cell { width: 260px; height: 200px; border-radius: 14px; overflow: hidden; box-shadow: inset 0 0 0 2px var(--line); }
  .cell .scan { position: absolute; left: 0; right: 0; top: 0; height: 3px; background: var(--pink); }

  /* Motion Design */
  #bez { left: 510px; top: 168px; font-weight: 500; font-size: 26px; color: var(--muted); }

  /* UI/UX */
  #phone { overflow: hidden; z-index: 3; }
  #pfill { position: absolute; inset: 0; background: var(--paper); transform-origin: 50% 100%; }
  #pcontent { position: absolute; left: 0; top: 0; width: 420px; height: 800px; color: var(--ink); transform-origin: 210px 400px; }
  #ptitle { left: 36px; top: 46px; font-weight: 900; font-size: 40px; line-height: 1.05; }
  #track { left: 300px; top: 44px; width: 84px; height: 44px; border-radius: 22px; }
  #chart { left: 36px; top: 150px; width: 348px; height: 220px; }
  #chart b { position: absolute; bottom: 0; width: 50px; border-radius: 8px 8px 0 0; transform-origin: 50% 100%; }
  #slab { left: 36px; top: 410px; font-weight: 500; font-size: 22px; }
  #sval { right: 36px; top: 410px; font-weight: 900; font-size: 22px; }
  #strack { left: 36px; top: 470px; width: 348px; height: 6px; border-radius: 3px; background: #CFCFCA; }
  #sfill { left: 0; top: 0; width: 348px; height: 6px; border-radius: 3px; background: var(--blue); transform-origin: 0 50%; }
  #sknob { left: -15px; top: -12px; width: 30px; height: 30px; border-radius: 50%; background: var(--ink); }
  #btnm { left: 36px; top: 640px; width: 348px; height: 84px; border-radius: 42px; overflow: hidden; }
  #btn { position: absolute; inset: 0; border-radius: 42px; background: var(--blue); color: var(--paper);
         font-weight: 500; font-size: 28px; display: flex; align-items: center; justify-content: center; }

  /* Digital & Social: muro curvo in 3D */
  #scene3d { left: 0; top: 0; width: 1920px; height: 1080px; perspective: 1400px; perspective-origin: 960px 500px;
             transform-origin: 960px 500px; z-index: 2; }
  #ring { left: 960px; top: 500px; width: 0; height: 0; transform-style: preserve-3d; }
  .pc { position: absolute; left: -110px; top: -137.5px; width: 220px; height: 275px; border-radius: 18px;
        background: var(--paper); overflow: hidden; backface-visibility: hidden; }
  .pc .pimg { position: absolute; left: 10px; top: 10px; width: 200px; height: 200px; border-radius: 12px; overflow: hidden; }
  .pc .pimg svg { display: block; }
  .pc .pcap { position: absolute; left: 14px; right: 14px; bottom: 20px; height: 26px; }
  .pc .pcap svg { position: absolute; left: 0; top: 1px; }
  .pc .pcap i { position: absolute; left: 36px; top: 4px; width: 110px; height: 7px; border-radius: 4px; background: #CFCFCA; }
  .pc .pcap i + i { top: 16px; width: 70px; }
  .pc .plight { position: absolute; inset: 0; background: var(--green); opacity: 0; }

  /* Riepilogo: sei tessere */
  .tile { top: 380px; width: 240px; height: 240px; border-radius: 24px; box-shadow: inset 0 0 0 2px var(--line);
          display: grid; place-items: center; }

  /* Comandi */
  #ui { position: fixed; left: 0; right: 0; bottom: 0; height: 56px; display: flex; align-items: center; justify-content: center;
        gap: 14px; font: 14px/1 system-ui, sans-serif; color: #bbb; }
  #ui button { font: inherit; color: #eee; background: #1b1b1b; border: 1px solid #333; border-radius: 8px; padding: 8px 14px; cursor: pointer; }
  #ui button:focus-visible, #ui input:focus-visible { outline: 2px solid #3D5AFF; outline-offset: 2px; }
  #ui input { width: min(46vw, 620px); accent-color: #3D5AFF; }
  #tc { width: 92px; font-variant-numeric: tabular-nums; }
  body.clean #ui { display: none; }

  /* Modalità scroll: la pagina è lunga, lo stage resta fermo e il tempo segue lo scroll */
  html.scroll, html.scroll body { overflow-x: hidden; overflow-y: visible; height: auto; }
  body.scroll #stage { position: fixed; }
  body.scroll #ui { display: none; }
  #scroller { display: none; }
  body.scroll #scroller { display: block; height: 850vh; }
  #hint { position: fixed; left: 0; right: 0; bottom: 28px; text-align: center; display: none;
          font: 500 15px/1 "Cabinet Grotesk", system-ui, sans-serif; color: #8A8A8A; transition: opacity .25s; }
  body.scroll #hint { display: block; }
</style>
</head>
<body>
<div id="stage" role="img" aria-label="Showreel di LIKEMOMMADEME, Creative Designer: Brand Identity, Illustration, Generative AI, Motion Design, UI/UX Design, Digital & Social.">

  <div id="scene3d" class="abs"><div id="ring" class="abs"></div></div>

  <div id="tiles"></div>

  <div id="card" class="abs"><div class="mono">L</div><div class="n">LIKEMOMMADEME</div><div class="r">Creative Designer</div><span class="bar abs"></span><span class="bar abs"></span></div>
  <div id="palette" class="abs"><span style="background:var(--blue)"></span><span style="background:var(--ink);box-shadow:inset 0 0 0 3px var(--paper)"></span><span style="background:var(--paper)"></span></div>

  <div id="prompt" class="abs"><span class="mask"><span><span id="ptext"></span><span class="caret"></span></span></span></div>
  <div id="cells"></div>

  <div id="bez" class="abs"><span class="mask"><span>cubic-bezier(.16, 1, .3, 1)</span></span></div>

  <div id="phone" class="abs">
    <div id="pfill"></div>
    <div id="pcontent">
      <div id="ptitle" class="abs"><span class="mask"><span>Ciao, mamma!</span></span></div>
      <div id="track" class="abs"></div>
      <div id="chart" class="abs"></div>
      <div id="slab" class="abs">Ironia</div>
      <div id="sval" class="abs">15%</div>
      <div id="strack" class="abs"><div id="sfill" class="abs"></div><div id="sknob" class="abs"></div></div>
      <div id="btnm" class="abs"><div id="btn">Avanti</div></div>
    </div>
  </div>

  <svg id="fx" viewBox="0 0 1920 1080" aria-hidden="true">
    <g id="grid" fill="none" stroke="#8A8A8A" stroke-width="2">
      <rect x="-260" y="-260" width="520" height="520" pathLength="1" vector-effect="non-scaling-stroke"/>
      <circle r="260" pathLength="1" vector-effect="non-scaling-stroke"/>
      <circle r="130" pathLength="1" vector-effect="non-scaling-stroke"/>
      <path d="M-360 0H360" pathLength="1" vector-effect="non-scaling-stroke"/>
      <path d="M0 -360V360" pathLength="1" vector-effect="non-scaling-stroke"/>
      <path d="M-260 -260L260 260" pathLength="1" vector-effect="non-scaling-stroke"/>
      <path d="M260 -260L-260 260" pathLength="1" vector-effect="non-scaling-stroke"/>
    </g>
    <g id="graph" fill="none">
      <path id="axes" d="M510 230V730H1410" stroke="#5E5E5E" stroke-width="3" pathLength="1"/>
      <path id="tl" d="M510 830H1410" stroke="#262626" stroke-width="4" stroke-linecap="round" pathLength="1"/>
      <path id="h1" d="M510 730L654 230" stroke="#8A8A8A" stroke-width="2"/>
      <path id="h2" d="M1410 230L780 230" stroke="#8A8A8A" stroke-width="2"/>
      <circle id="c1" cx="654" cy="230" r="12" fill="#FF3D8B"/>
      <circle id="c2" cx="780" cy="230" r="12" fill="#FF3D8B"/>
      <path id="curve" d="M510 730C654 230 780 230 1410 230" stroke="#FF3D8B" stroke-width="6" stroke-linecap="round" pathLength="1"/>
      <rect class="kf" x="-13" y="-13" width="26" height="26" rx="4" fill="#FF3D8B"/>
      <rect class="kf" x="-13" y="-13" width="26" height="26" rx="4" fill="#FF3D8B"/>
      <rect class="kf" x="-13" y="-13" width="26" height="26" rx="4" fill="#FF3D8B"/>
      <path id="head" d="M0 -34V34" stroke="#F5F5F2" stroke-width="3" stroke-linecap="round"/>
    </g>
    <path id="blob"/>
    <path id="contour" fill="none" stroke="#F5F5F2" stroke-width="5" stroke-linejoin="round" pathLength="1"/>
    <g id="face">
      <circle id="eyeL" r="16" fill="#0A0A0A"/>
      <circle id="eyeR" r="16" fill="#0A0A0A"/>
      <path id="smile" d="M-84 40Q0 128 84 40" fill="none" stroke="#0A0A0A" stroke-width="14" stroke-linecap="round" pathLength="1"/>
    </g>
  </svg>

  <div id="name" aria-hidden="true"></div>
  <div id="role" aria-hidden="true"><span class="mask"><span>Creative Designer</span></span></div>
  <div id="sq1" class="abs sq" style="background:var(--blue)"></div>
  <div id="sq2" class="abs sq" style="background:var(--pink)"></div>
  <div id="mark" class="abs"><span class="mask"><span>LIKEMOMMADEME</span></span></div>
  <div id="worlds" aria-hidden="true"></div>
</div>

<div id="scroller"></div>
<div id="hint">Scorri: sei mondi ti aspettano</div>
<div id="ui">
  <button id="pp" type="button">Pausa</button>
  <input id="scrub" type="range" min="0" max="15" step="0.01" value="0" aria-label="Posizione nel tempo">
  <span id="tc">00.00 / 15</span>
  <button id="snd" type="button" aria-pressed="false">Suono: no</button>
</div>

<script>
(() => {
  /* ---------- Costanti ---------- */
  const DUR = 15, BEAT = .5, TAU = Math.PI * 2;
  const INK = '#0A0A0A', PAPER = '#F5F5F2', BLUE = '#3D5AFF', GREEN = '#12C08E', PINK = '#FF3D8B', TRACK = '#CFCFCA', LINE = '#262626';
  const G = 95;                                  // apertura del nome
  const WORLDS = [['Brand Identity', BLUE], ['Illustration', GREEN], ['Generative AI', PINK],
                  ['Motion Design', PINK], ['UI/UX Design', BLUE], ['Digital & Social', GREEN]];
  const TILE_X = [280, 552, 824, 1096, 1368, 1640], TILE_Y = 500;
  const SELX = 1102, SELY = 500;                 // cella scelta nella griglia AI
  const P = { x: 750, y: 120, w: 420, h: 800 };  // schermo del telefono
  const POST = { x: 720, y: 200, w: 480, h: 600 };
  const KY = P.y + 66, KOFF = P.x + 322, KON = P.x + 362;
  const RING_R = 1400, PERSP = 1400, CARD_H = 275;
  const DZ0 = PERSP - PERSP * CARD_H / POST.h;   // dolly iniziale: la card centrale coincide col post
  const BZ = [[510, 730], [654, 230], [780, 230], [1410, 230]];

  /* ---------- Funzioni del tempo ---------- */
  const clamp = (x, a = 0, b = 1) => x < a ? a : x > b ? b : x;
  const p = (t, a, b) => clamp((t - a) / (b - a));
  const lerp = (a, b, k) => a + (b - a) * k;
  const eOut = x => x >= 1 ? 1 : 1 - Math.pow(2, -10 * x);
  const eIn = x => x <= 0 ? 0 : Math.pow(2, 10 * x - 10);
  const eIO = x => x <= 0 ? 0 : x >= 1 ? 1 : x < .5 ? Math.pow(2, 20 * x - 10) / 2 : (2 - Math.pow(2, -20 * x + 10)) / 2;
  const spring = x => x <= 0 ? 0 : x >= 1 ? 1 : 1 - (1 + 9 * x) * Math.exp(-9 * x);   // smorzamento critico: niente rimbalzo
  const bump = x => Math.sin(Math.PI * clamp(x));
  const rgb = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
  const mix = (a, b, k) => { const A = rgb(a), B = rgb(b); return `rgb(${A.map((v, i) => Math.round(lerp(v, B[i], k))).join(',')})`; };
  const maskY = (t, a, d, b, e, dir = 1) => {
    if (t < a) return 110;
    let y = 110 * (1 - eOut(p(t, a, a + d)));
    if (b != null && t >= b) y = 110 * dir * eIn(p(t, b, b + e));
    return y;
  };
  const bez = s => {
    const u = 1 - s;
    return [0, 1].map(i => u * u * u * BZ[0][i] + 3 * u * u * s * BZ[1][i] + 3 * u * s * s * BZ[2][i] + s * s * s * BZ[3][i]);
  };

  /* ---------- Forme ---------- */
  const SQ = a => Math.pow(Math.pow(Math.abs(Math.cos(a)), 6) + Math.pow(Math.abs(Math.sin(a)), 6), -1 / 6);
  const CI = () => 1;
  const FL = a => 1 + .13 * Math.sin(6 * a);
  const BL = a => 1 + .09 * Math.sin(3 * a + 1) + .05 * Math.sin(5 * a + 2.2);
  const N = 180;
  function shape(cx, cy, R, A, B, k, rot = 0, hand = false) {
    if (R < .5) return 'M0 0';
    let d = '';
    for (let j = 0; j < N; j++) {
      const a = j / N * TAU;
      let r = R * lerp(A(a + rot), B(a + rot), k);
      if (hand) r = r * 1.1 + Math.sin(11 * a) * 5 + Math.sin(23 * a + 1) * 3;
      d += (j ? 'L' : 'M') + (cx + r * Math.cos(a)).toFixed(1) + ' ' + (cy + r * Math.sin(a)).toFixed(1);
    }
    return d + 'Z';
  }
  const svgEl = (w, h, inner) => `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true">${inner}</svg>`;

  /* ---------- Costruzione del DOM ---------- */
  const $ = s => document.querySelector(s);
  const stage = $('#stage');
  const nameEl = $('#name');
  'LIKEMOMMADEME'.split('').forEach(ch => {
    const m = document.createElement('span'); m.className = 'mask';
    const c = document.createElement('span'); c.textContent = ch;
    m.appendChild(c); nameEl.appendChild(m);
  });
  const masks = [...nameEl.children], letters = masks.map(m => m.firstChild);
  const group = i => i < 4 ? 0 : i < 9 ? 1 : 2;

  const worldsEl = $('#worlds');
  WORLDS.forEach(([label, col], i) => {
    const w = document.createElement('div'); w.className = 'w'; w.style.left = TILE_X[i] + 'px';
    w.innerHTML = `<span class="mask"><span>${label}</span></span><i style="background:${col}"></i>`;
    worldsEl.appendChild(w);
  });
  const worldEls = [...worldsEl.children];

  // Griglia di varianti AI
  const cellsEl = $('#cells'), shapes = [FL, SQ, BL, CI], cols = [PINK, PAPER, BLUE, GREEN];
  for (let c = 0; c < 12; c++) {
    const el = document.createElement('div'); el.className = 'abs cell';
    el.style.left = (404 + (c % 4) * 284) + 'px'; el.style.top = (176 + Math.floor(c / 4) * 224) + 'px';
    if (c !== 6) {
      const col = cols[(c * 5 + 1) % 4], outline = c % 5 === 2;
      const d = shape(130, 100, 62, shapes[c % 4], shapes[(c * 3 + 1) % 4], .35, c * .7);
      el.innerHTML = svgEl(260, 200, `<path d="${d}" ${outline ? `fill="none" stroke="${col}" stroke-width="5"` : `fill="${col}"`}/>`);
    }
    el.insertAdjacentHTML('beforeend', '<div class="scan"></div>');
    cellsEl.appendChild(el);
  }
  const cells = [...cellsEl.children];
  const cellOrder = [0, 1, 2, 3, 7, 11, 10, 9, 8, 4, 5];

  // Grafico a barre del telefono
  const chart = $('#chart'), BARS = [110, 170, 80, 200, 140];
  BARS.forEach((h, i) => {
    const b = document.createElement('b'); b.style.left = (i * 70) + 'px'; b.style.height = h + 'px';
    b.style.background = i === 3 ? BLUE : INK; chart.appendChild(b);
  });
  const bars = [...chart.children];

  // Muro di post: 7 colonne x 3 righe su un cilindro
  const ring = $('#ring'), posts = [];
  const heart = c => svgEl(24, 24, `<path d="M12 21s-8-5.3-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 5.7-8 11-8 11z" fill="${c}"/>`);
  for (let r = 0; r < 3; r++) for (let c = 0; c < 7; c++) {
    const i = r * 7 + c, center = r === 1 && c === 3;
    const bg = center ? PINK : [BLUE, INK, GREEN, PINK, INK, BLUE, GREEN][(i * 3) % 7];
    const fg = bg === INK ? [PINK, GREEN, PAPER][i % 3] : (bg === PINK ? INK : PAPER);
    let art;
    if (center) art = `<path d="${shape(100, 100, 62, BL, BL, 0, .6)}" fill="${INK}"/>`;
    else if (i % 4 === 0) art = `<text x="100" y="138" text-anchor="middle" font-family="Cabinet Grotesk" font-weight="900" font-size="120" fill="${fg}">L</text>`;
    else if (i % 4 === 1) art = `<path d="${shape(100, 100, 58, shapes[i % 4], FL, .5, i)}" fill="${fg}"/>`;
    else if (i % 4 === 2) art = `<path d="M40 160C70 50 95 50 160 50" fill="none" stroke="${fg}" stroke-width="10" stroke-linecap="round"/>`;
    else art = `<rect x="55" y="40" width="90" height="120" rx="14" fill="${fg}"/><rect x="70" y="128" width="60" height="16" rx="8" fill="${bg}"/>`;
    const el = document.createElement('div'); el.className = 'pc';
    el.innerHTML = `<div class="pimg" style="background:${bg}">${svgEl(200, 200, art)}</div>
      <div class="pcap">${heart(center ? PINK : INK)}<i></i><i></i></div><div class="plight"></div>`;
    ring.appendChild(el);
    posts.push({ el, img: el.querySelector('.pimg'), light: el.querySelector('.plight'), r, c, center,
                 ang: (c - 3) * 9.8, y: (r - 1) * 300, d: Math.abs(c - 3) + Math.abs(r - 1) });
  }

  // Sei tessere del riepilogo
  const tilesEl = $('#tiles');
  const tileArt = [
    `<div style="width:150px;height:150px;border-radius:20px;background:${BLUE};color:${PAPER};font-weight:900;font-size:118px;line-height:150px;text-align:center">L</div>`,
    svgEl(240, 240, `<circle cx="120" cy="120" r="72" fill="${GREEN}"/><circle cx="96" cy="108" r="7" fill="${INK}"/><circle cx="144" cy="108" r="7" fill="${INK}"/><path d="M90 132Q120 164 150 132" fill="none" stroke="${INK}" stroke-width="7" stroke-linecap="round"/>`),
    svgEl(240, 240, [0, 1, 2, 3, 4, 5, 6, 7, 8].map(k => `<rect x="${54 + (k % 3) * 46}" y="${54 + Math.floor(k / 3) * 46}" width="38" height="38" rx="9" ${k === 4 ? `fill="${PINK}"` : `fill="none" stroke="${k % 2 ? '#5E5E5E' : PINK}" stroke-width="3"`}/>`).join('')),
    svgEl(240, 240, `<path d="M50 50V190H190" fill="none" stroke="#5E5E5E" stroke-width="3"/><path d="M50 190C72 60 92 60 190 60" fill="none" stroke="${PINK}" stroke-width="7" stroke-linecap="round"/><circle cx="150" cy="61" r="11" fill="${PINK}"/>`),

    if (e.target === scrub || scrollMode) return;
    if (e.code === 'Space') { e.preventDefault(); setPlaying(!playing); }
    if (e.code === 'ArrowRight' || e.code === 'ArrowLeft') { setPlaying(false); rebase(clamp(Math.round(base / BEAT) * BEAT + (e.code === 'ArrowRight' ? BEAT : -BEAT), 0, DUR)); }
  });

  function fit() {
    const uiH = document.body.classList.contains('clean') || document.body.classList.contains('scroll') ? 0 : 56;
    const S = Math.min(innerWidth / 1920, (innerHeight - uiH) / 1080);
    stage.style.transform = `translate(${(innerWidth - 1920 * S) / 2}px, ${(innerHeight - uiH - 1080 * S) / 2}px) scale(${S})`;
  }
  addEventListener('resize', fit); fit();

  // Scroll: il tempo insegue la posizione con uno smorzamento esponenziale, così lo scrub è morbido
  let st = 0, lastNow = 0;
  const hint = E('hint');
  function scrollFrame(now) {
    const max = document.documentElement.scrollHeight - innerHeight;
    const target = max > 0 ? clamp(scrollY / max) * DUR : 0;
    const dt = lastNow ? Math.min(.05, (now - lastNow) / 1000) : .016; lastNow = now;
    st += (target - st) * (1 - Math.exp(-dt * 9));
    if (Math.abs(target - st) < .001) st = target;
    seek(st);
    hint.style.opacity = st < .3 ? '1' : '0';
    requestAnimationFrame(scrollFrame);
  }

  function frame() {
    const tu = nowT();
    if (playing && sound) schedule(tu);
    const t = playing ? ((tu % DUR) + DUR) % DUR : clamp(tu, 0, DUR);
    seek(t);
    if (!dragging) scrub.value = t.toFixed(2);
    tc.textContent = t.toFixed(2).padStart(5, '0') + ' / 15';
    requestAnimationFrame(frame);
  }

  window.seek = t => { playing = false; rebase(t); seek(t); };
  const start = () => { if (M) return; measure(); rebase(base); document.documentElement.dataset.ready = '1';
    if (scrollMode && qs.has('at')) scrollTo(0, parseFloat(qs.get('at')) * (document.documentElement.scrollHeight - innerHeight));   // per i test
    requestAnimationFrame(scrollMode ? scrollFrame : frame); };
  document.fonts.ready.then(start);
  setTimeout(start, 2500);
})();
</script>
